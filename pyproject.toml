[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "enterprise-rag-agentic-ai-copilot"
version = "0.1.0"
description = "Enterprise-grade RAG and Agentic AI copilot for grounded retrieval, orchestration, evaluation and responsible AI."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = {text = "MIT"}
authors = [{name = "Antony Pereira George"}]
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.9",
  "pydantic-settings>=2.5",
  "python-dotenv>=1.0",
  "transformers>=4.45",
  "sentence-transformers>=3.1",
  "torch>=2.4",
  "faiss-cpu>=1.8",
  "rank-bm25>=0.2.2",
  "langchain>=0.3",
  "langgraph>=0.2",
  "mlflow>=2.16",
  "pandas>=2.2",
  "numpy>=2.0",
  "scikit-learn>=1.5",
  "streamlit>=1.38",
  "httpx>=0.27",
  "orjson>=3.10"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "mypy>=1.11",
  "pre-commit>=3.8"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
ignore_missing_imports = true
