[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "enterprise-rag-agentic-ai-copilot"
version = "1.0.0"
description = "Enterprise-grade RAG and Agentic AI copilot for grounded retrieval, orchestration, evaluation and responsible AI."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = {text = "MIT"}
authors = [{name = "Antony Pereira George"}]
dependencies = []

[project.optional-dependencies]
api = [
  "fastapi>=0.141.1,<0.142",
  "uvicorn[standard]>=0.30",
]
dense = [
  "faiss-cpu>=1.8",
  "numpy>=2.0",
  "sentence-transformers>=3.1",
  "torch>=2.4",
]
mlops = [
  "mlflow>=2.16",
  "PyYAML>=6.0.3",
]
dev = [
  "fastapi>=0.141.1,<0.142",
  "httpx>=0.28",
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "mypy>=1.11",
  "pre-commit>=3.8",
  "PyYAML>=6.0.3"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
enterprise_copilot = ["ui/*.html"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
filterwarnings = [
  "ignore:Using `httpx` with `starlette.testclient` is deprecated:Warning",
  "ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
ignore_missing_imports = true
