name: quality-and-container

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install lightweight CI dependencies
        run: python -m pip install -r requirements-ci.txt

      - name: Generate deterministic local data
        env:
          PYTHONPATH: src
        run: |
          python scripts/generate_synthetic_corpus.py
          python scripts/ingest_knowledge_base.py
          python scripts/build_retrieval_index.py
          python scripts/build_bm25_index.py
          python scripts/generate_hard_evaluation_set.py
          python scripts/generate_agent_guardrail_set.py

      - name: Check style
        run: |
          ruff check .
          ruff format --check .

      - name: Reproduce evaluation artifacts
        env:
          PYTHONPATH: src
        run: |
          python scripts/evaluate_hybrid_retrieval.py
          python scripts/evaluate_grounded_answers.py
          python scripts/evaluate_agent_workflow.py
          python scripts/validate_api.py
          python scripts/validate_model_integration.py
          python scripts/record_experiment.py
          python scripts/validate_mlops.py

      - name: Run tests with coverage
        env:
          PYTHONPATH: src
        run: pytest --cov=enterprise_copilot --cov-report=xml:artifacts/coverage.xml --cov-fail-under=90 -q

      - name: Validate final release acceptance
        env:
          PYTHONPATH: src
        run: python scripts/validate_project.py

      - name: Preserve evaluation and experiment evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: v1-release-quality-evidence
          if-no-files-found: warn
          path: |
            artifacts/coverage.xml
            artifacts/experiments/**
            data/evaluation/*.json

  container:
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Build image
        run: docker build --tag enterprise-copilot:ci .

      - name: Validate Compose definition
        run: docker compose config --quiet

      - name: Health-check container
        run: |
          container_id=$(docker run --detach --publish 127.0.0.1:18000:8000 enterprise-copilot:ci)
          trap 'docker logs "$container_id"; docker rm --force "$container_id"' EXIT
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:18000/health; then
              exit 0
            fi
            sleep 1
          done
          exit 1
